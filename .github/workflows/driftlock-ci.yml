name: DriftLock CI Gatekeeper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: AST Audit & Contract Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run DriftLock AST Audit Demo
        run: |
          python -m driftlock.cli.main demo

      - name: Run DriftLock Closed-Loop Auto-Remediation Verification
        run: |
          python -m driftlock.cli.main demo --fix
