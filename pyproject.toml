[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlock"
version = "0.1.0"
description = "Autonomous AST drift and contract consistency engine"
readme = "DRIFTLOCK_STATE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
driftlock = "driftlock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
